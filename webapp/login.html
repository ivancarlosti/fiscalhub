<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#1a73e8">
    <meta name="description" content="Fiscal Hub — Login">
    <title>Fiscal Hub — Login</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🔐</text></svg>">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
          integrity="sha384-t1nt8BQoYMLFN5p42tRAtuAAFQaCQODekUVeKKZrEnEyp4H2R0RHFz0KWpmj7i8g"
          crossorigin="anonymous">
    <link rel="stylesheet" href="styles.css">
</head>
<body class="login-page">

<div class="login-wrapper">
    <div class="login-card">

        <!-- Logo / Branding -->
        <div class="login-card__brand">
            <div class="login-card__logo">
                <i class="fa-solid fa-file-invoice"></i>
            </div>
            <h1 class="login-card__title">Fiscal Hub</h1>
            <p class="login-card__subtitle">Documentos Fiscais e Consultas</p>
        </div>

        <!-- Error Messages -->
        <div class="login-error" id="login-error" style="display:none;">
            <i class="fa-solid fa-circle-exclamation"></i>
            <span id="login-error-text"></span>
        </div>

        <!-- Login Form (account mode) -->
        <form class="login-form" method="POST" action="login.php" autocomplete="off" id="login-form">
            <input type="hidden" name="redirect" id="login-redirect" value="/">

            <div class="login-form__field">
                <label class="login-form__label" for="username">
                    <i class="fa-solid fa-user"></i> Usuário
                </label>
                <input
                    type="text"
                    id="username"
                    name="username"
                    class="login-form__input"
                    placeholder="Digite seu usuário"
                    autocomplete="username"
                    required
                    autofocus
                >
            </div>

            <div class="login-form__field">
                <label class="login-form__label" for="password">
                    <i class="fa-solid fa-lock"></i> Senha
                </label>
                <input
                    type="password"
                    id="password"
                    name="password"
                    class="login-form__input"
                    placeholder="Digite sua senha"
                    autocomplete="current-password"
                    required
                >
            </div>

            <!-- Google reCAPTCHA v2 — filled in by auth-config.php when enabled -->
            <div class="login-form__captcha" id="login-captcha" hidden></div>

            <button type="submit" class="login-form__submit" id="login-submit">
                <i class="fa-solid fa-right-to-bracket"></i> Entrar
            </button>
        </form>

        <!-- SSO login (shown when AUTH_METHOD=keycloak) -->
        <div class="login-sso" id="login-sso" hidden>
            <i class="fa-solid fa-shield-halved login-sso__icon"></i>
            <p class="login-sso__text">
                Esta aplicação usa autenticação SSO (Keycloak). O acesso é feito pelo
                provedor de identidade — usuário e senha não são utilizados neste modo.
            </p>
            <!-- href is completed with the redirect target by the script below -->
            <a class="login-form__submit login-sso__link" id="login-sso-start" href="keycloak-login.php">
                <i class="fa-solid fa-right-to-bracket"></i> Entrar com Keycloak
            </a>
        </div>

    </div>
</div>

<script>
(function() {
    const params = new URLSearchParams(window.location.search);
    const redirect = params.get('redirect') || '/';
    const errorCode = params.get('error');

    document.getElementById('login-redirect').value = redirect;

    const form = document.getElementById('login-form');
    const errorBox = document.getElementById('login-error');
    const errorText = document.getElementById('login-error-text');

    function showError(message, type) {
        errorText.textContent = message;
        errorBox.style.display = 'flex';
        errorBox.classList.toggle('login-error--info', type === 'info');
    }

    const messages = {
        invalid: 'Usuário ou senha inválidos. Tente novamente.',
        empty: 'Preencha todos os campos.',
        captcha: 'Falha na verificação de segurança. Marque "Não sou um robô" e tente novamente.',
        sso: 'Não foi possível concluir o login pelo provedor de identidade. Tente novamente.',
        sso_config: 'O login SSO está incompleto neste servidor (cliente ou URL de callback). Contate o administrador.'
    };

    if (messages[errorCode]) {
        showError(messages[errorCode]);
    } else if (params.get('logged_out') === '1') {
        showError('Você saiu da sua conta.', 'info');
    }

    // ── Google reCAPTCHA v2 (account mode, only when configured) ──
    let recaptchaWidgetId = null;

    window.__fiscalhubRecaptchaReady = function() {
        recaptchaWidgetId = window.grecaptcha.render('login-captcha', {
            sitekey: window.__fiscalhubRecaptchaSiteKey
        });
        // Tokens are single-use — a failed attempt needs a fresh widget
        if (errorCode === 'captcha' && typeof window.grecaptcha.reset === 'function') {
            window.grecaptcha.reset(recaptchaWidgetId);
        }
    };

    function initRecaptcha(siteKey) {
        window.__fiscalhubRecaptchaSiteKey = siteKey;
        document.getElementById('login-captcha').hidden = false;
        const script = document.createElement('script');
        script.src = 'https://www.google.com/recaptcha/api.js?onload=__fiscalhubRecaptchaReady&render=explicit';
        script.async = true;
        script.defer = true;
        document.head.appendChild(script);
    }

    form.addEventListener('submit', function(e) {
        // reCAPTCHA is not enabled on this deployment
        if (recaptchaWidgetId === null) return;

        const token = window.grecaptcha && typeof window.grecaptcha.getResponse === 'function'
            ? window.grecaptcha.getResponse(recaptchaWidgetId)
            : '';

        if (!token) {
            e.preventDefault();
            showError('Marque a caixa "Não sou um robô" para continuar.');
        }
    });

    // ── Server-side auth configuration (non-secret values only) ──
    fetch('auth-config.php', { credentials: 'same-origin', cache: 'no-store' })
        .then(function(response) {
            return response.ok ? response.json() : Promise.reject(new Error('config'));
        })
        .then(function(config) {
            // keycloak mode: the credentials form must never be shown
            if (config.authMethod === 'keycloak') {
                form.hidden = true;
                // The button starts the provider flow and comes back to the page
                // the user asked for (keycloak-login.php does the redirect).
                document.getElementById('login-sso-start').href =
                    'keycloak-login.php?redirect=' + encodeURIComponent(redirect);
                document.getElementById('login-sso').hidden = false;
                return;
            }
            if (config.recaptchaEnabled && config.recaptchaSiteKey) {
                initRecaptcha(config.recaptchaSiteKey);
            }
        })
        .catch(function() {
            // Keep the default account form when the config cannot be loaded;
            // the server still enforces the auth method and reCAPTCHA.
        });
})();
</script>

</body>
</html>
